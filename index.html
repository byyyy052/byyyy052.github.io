<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>象数时空能量推演引擎</title>
<style>
  :root {
    --bg: #050505;
    --card: #111;
    --line: #333;
    --text: #e0e0e0;
    --gold: #d4af37;
    --gold-glow: rgba(212, 175, 55, 0.2);
    --blue: #4fa8ff;
    --red: #ff4a4a;
    --green: #4caf50;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 20px 16px; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    line-height: 1.6; overflow-x: hidden;
  }
  .wrap { max-width: 520px; margin: 0 auto; }

  /* 顶部 */
  .header { text-align: center; margin-bottom: 30px; }
  .header h1 { color: var(--gold); font-size: 24px; letter-spacing: 4px; margin: 0 0 8px 0; text-shadow: 0 0 10px var(--gold-glow);}
  .header p { color: #888; font-size: 12px; margin: 0; font-family: monospace;}

  /* 输入区 */
  .panel {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 12px; padding: 20px; margin-bottom: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    transition: opacity 0.5s;
  }
  .input-row { display: flex; gap: 10px; margin-bottom: 15px; }
  .input-group { flex: 1; }
  .input-group label { display: block; font-size: 12px; color: #888; margin-bottom: 6px; }
  input, select {
    width: 100%; padding: 12px; border-radius: 6px; border: 1px solid var(--line);
    background: #000; color: var(--text); font-size: 14px; outline: none;
  }
  input:focus, select:focus { border-color: var(--gold); }
  
  .btn-start {
    width: 100%; padding: 16px; background: var(--gold); color: #000;
    border: none; border-radius: 6px; font-size: 16px; font-weight: bold;
    cursor: pointer; letter-spacing: 2px; box-shadow: 0 0 15px var(--gold-glow);
    transition: 0.2s;
  }
  .btn-start:active { transform: scale(0.98); }
  .btn-start:disabled { background: #333; color: #666; box-shadow: none; cursor: not-allowed; }

  /* 演算过程区 */
  #process { display: none; }
  
  .step-box {
    background: var(--card); border: 1px solid var(--line); border-left: 3px solid var(--blue);
    border-radius: 0 8px 8px 0; padding: 16px; margin-bottom: 16px;
    opacity: 0; transform: translateX(-10px); transition: all 0.5s ease;
  }
  .step-box.show { opacity: 1; transform: translateX(0); }
  
  .step-title {
    font-size: 14px; color: var(--blue); font-weight: bold; margin-bottom: 10px;
    display: flex; align-items: center; gap: 8px;
  }
  .step-title::before { content: ">"; font-family: monospace; color: var(--gold); }
  
  /* 盘面展示 */
  .bazi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; text-align: center; font-family: serif; }
  .bazi-item { background: #000; padding: 10px 0; border: 1px solid var(--line); border-radius: 4px; }
  .bazi-item .label { font-size: 10px; color: #888; margin-bottom: 4px; }
  .bazi-item .char { font-size: 20px; color: var(--gold); font-weight: bold; }
  
  /* 公式展示 */
  .formula {
    font-family: "Courier New", Courier, monospace; background: #000;
    padding: 12px; border-radius: 6px; border: 1px solid #333;
    color: var(--green); font-size: 13px; margin-top: 10px; overflow-x: auto; white-space: nowrap;
  }
  .formula .var { color: var(--gold); }
  .formula .op { color: #888; }
  .formula .val { color: var(--blue); }
  
  /* 结论卡片 */
  .result-card {
    background: linear-gradient(135deg, rgba(212,175,55,0.1), transparent);
    border: 1px solid var(--gold); border-radius: 12px; padding: 20px;
    margin-top: 24px; opacity: 0; transform: scale(0.95); transition: all 0.5s ease;
  }
  .result-card.show { opacity: 1; transform: scale(1); }
  .result-card.danger { background: linear-gradient(135deg, rgba(255,74,74,0.1), transparent); border-color: var(--red); }
  .result-card h3 { color: var(--gold); margin: 0 0 10px 0; font-size: 18px; }
  .result-card.danger h3 { color: var(--red); }
  .result-score { font-size: 32px; font-family: monospace; font-weight: bold; margin-bottom: 10px; color: var(--gold); }
  .result-card.danger .result-score { color: var(--red); }
  
  .loading-dots::after { content: '...'; animation: dots 1.5s infinite; }
  @keyframes dots { 0%, 20% { content: ''; } 40% { content: '.'; } 60% { content: '..'; } 80%, 100% { content: '...'; } }

</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <h1>象数时空推演</h1>
    <p>Integral Algorithm Engine v3.0</p>
  </div>

  <!-- 第一步：输入信息 -->
  <div class="panel" id="inputPanel">
    <div class="input-row">
      <div class="input-group">
        <label>出生年 (公历)</label>
        <input type="number" id="inYear" value="2006">
      </div>
      <div class="input-group">
        <label>月</label>
        <input type="number" id="inMonth" value="2">
      </div>
      <div class="input-group">
        <label>日</label>
        <input type="number" id="inDay" value="5">
      </div>
    </div>
    <div class="input-row">
      <div class="input-group">
        <label>时辰</label>
        <select id="inHour">
          <option value="戌" selected>戌时 (19:00-21:00)</option>
          <option value="子">子时 (23:00-01:00)</option>
          <option value="丑">丑时 (01:00-03:00)</option>
        </select>
      </div>
      <div class="input-group">
        <label>性别</label>
        <select id="inGender">
          <option value="男" selected>男</option>
          <option value="女">女</option>
        </select>
      </div>
    </div>
    
    <div class="input-row" style="margin-top: 15px;">
       <div class="input-group">
         <label>物理现实 (一票否决)</label>
         <select id="inVeto">
           <option value="false" selected>正常 (无阻碍)</option>
           <option value="true">异常 (暴雨/生病/风险)</option>
         </select>
       </div>
    </div>

    <button class="btn-start" id="startBtn" onclick="startEngine()">启动引擎排盘</button>
  </div>

  <!-- 第二步：演算过程 -->
  <div id="process">
    
    <!-- 1. 排盘 -->
    <div class="step-box" id="step1">
      <div class="step-title">Step 1: 四柱八字排盘</div>
      <div class="bazi-grid" id="baziGrid">
        <!-- JS 注入 -->
      </div>
      <div style="font-size:12px; color:#888; margin-top:10px;" id="baziDetail"></div>
    </div>

    <!-- 2. 起局 -->
    <div class="step-box" id="step2">
      <div class="step-title">Step 2: 紫微 & 奇门接驳</div>
      <div id="qimenDetail" style="font-size:13px;"></div>
    </div>

    <!-- 3. 微积分推导 -->
    <div class="step-box" id="step3">
      <div class="step-title">Step 3: 《代微积拾极》公式演算</div>
      <div style="font-size:13px; margin-bottom:10px;">提取原局参数，代入微积分势能模型：</div>
      
      <div class="formula" id="formulaBox1">
        E(t,θ) = ∫ μ(τ)dτ + Σ H_k
      </div>
      
      <div class="formula" id="formulaBox2" style="margin-top:10px; color:#888;">
        <!-- 动态注入 -->
      </div>
    </div>

    <!-- 最终结果 -->
    <div class="result-card" id="finalResult">
      <h3 id="resTitle">推演完毕</h3>
      <div class="result-score" id="resScore"></div>
      <div id="resDesc" style="font-size:14px;"></div>
    </div>

  </div>
</div>

<script>
// 简化的排盘逻辑（仅供前端演示）
function getBazi(year, month, day) {
  // 这里用固定的2006年2月5日作为演示，如果是其它日期，前端严格计算比较复杂，这里做个映射
  if (year == 2006 && month == 2 && day == 5) {
    return { year: '丙戌', month: '庚寅', day: '乙丑', hour: '丙戌' };
  }
  return { year: '丙戌', month: '庚寅', day: '乙丑', hour: '丙戌' }; // 默认演示数据
}

function startEngine() {
  const year = document.getElementById('inYear').value;
  const month = document.getElementById('inMonth').value;
  const day = document.getElementById('inDay').value;
  const hour = document.getElementById('inHour').value;
  const veto = document.getElementById('inVeto').value === 'true';

  // 隐藏输入区，显示过程区
  document.getElementById('inputPanel').style.display = 'none';
  document.getElementById('process').style.display = 'block';
  
  // 重置动画
  ['step1','step2','step3','finalResult'].forEach(id => {
    document.getElementById(id).classList.remove('show');
    if(id === 'finalResult') document.getElementById(id).classList.remove('danger');
  });
  document.getElementById('formulaBox2').innerHTML = '';

  const bazi = getBazi(year, month, day);
  
  // Step 1: 排八字
  setTimeout(() => {
    document.getElementById('baziGrid').innerHTML = `
      <div class="bazi-item"><div class="label">年柱</div><div class="char">${bazi.year[0]}<br>${bazi.year[1]}</div></div>
      <div class="bazi-item"><div class="label">月柱</div><div class="char">${bazi.month[0]}<br>${bazi.month[1]}</div></div>
      <div class="bazi-item"><div class="label">日柱</div><div class="char">${bazi.day[0]}<br>${bazi.day[1]}</div></div>
      <div class="bazi-item"><div class="label">时柱</div><div class="char">${bazi.hour[0]}<br>${bazi.hour[1]}</div></div>
    `;
    document.getElementById('baziDetail').innerHTML = `
      日主：<span style="color:#d4af37">${bazi.day[0]}</span> (木)。生于${bazi.month[1]}月，得令。<br>
      五行生克：丙火双透，戌丑土重，水藏于丑。
    `;
    document.getElementById('step1').classList.add('show');
    document.getElementById('step1').scrollIntoView({behavior: 'smooth', block: 'center'});
  }, 600);

  // Step 2: 紫微奇门接驳
  setTimeout(() => {
    document.getElementById('qimenDetail').innerHTML = `
      紫微命宫：<span style="color:#4fa8ff">辰宫</span> (天机化权、天梁)。<br>
      奇门局象：<span style="color:#4fa8ff">阳遁4局</span>。值符天心在坤，值使开门在艮。<br>
      空亡：<span style="color:#ff4a4a">午、未</span>。 马星：<span style="color:#d4af37">申</span>。<br>
      <span style="color:#888">(已提取时空能量干预参数)</span>
    `;
    document.getElementById('step2').classList.add('show');
    document.getElementById('step2').scrollIntoView({behavior: 'smooth', block: 'center'});
  }, 1800);

  // Step 3: 微积分公式演算
  setTimeout(() => {
    document.getElementById('formulaBox1').innerHTML = `
      <span class="var">E(t,θ)</span> <span class="op">=</span> ∫<span class="var">μ(τ)dτ</span> <span class="op">+</span> Σ<span class="var">H_k e^...</span> <span class="op">+</span> <span class="var">ε</span>
    `;
    
    document.getElementById('formulaBox2').innerHTML = `
      <span class="op">// 正在代入参数...</span><br>
      <span class="var">基础能量</span> <span class="op">=</span> <span class="val">2.0</span><br>
      <span class="var">大运积分 (壬辰)</span> <span class="op">=</span> <span class="val">+1.15 (相生)</span><br>
      <span class="var">流年脉冲 (丙午)</span> <span class="op">=</span> <span class="val">-1.0 (空亡阻尼)</span><br>
      <span class="var">奇门方位 (东北)</span> <span class="op">=</span> <span class="val">+2.0</span><br>
      <span class="op">--------------------------------</span><br>
      <span class="var">E(t,θ)</span> <span class="op">=</span> (2.0 * 1.15) - 1.0 + 2.0 = <span class="val">3.30</span>
    `;
    document.getElementById('step3').classList.add('show');
    document.getElementById('step3').scrollIntoView({behavior: 'smooth', block: 'center'});
  }, 3000);

  // 最终结论
  setTimeout(() => {
    const resBox = document.getElementById('finalResult');
    
    if (veto) {
      resBox.classList.add('danger');
      document.getElementById('resTitle').innerText = '⚠️ 物理现实一票否决';
      document.getElementById('resScore').innerText = 'VETO';
      document.getElementById('resDesc').innerHTML = '系统检测到外部不可抗力（暴雨/生病/风险）。<b>终止一切命理推演，现实条件绝对优先。</b>';
    } else {
      document.getElementById('resTitle').innerText = '最终决策结论';
      document.getElementById('resScore').innerText = 'E = +3.30';
      document.getElementById('resDesc').innerHTML = '宏观势能向好。奇门盘显示<b>艮东北方 (开门)</b>能量最强。建议前往该方位执行计划，把握时机。';
    }
    
    resBox.classList.add('show');
    resBox.scrollIntoView({behavior: 'smooth', block: 'center'});
  }, 4200);
}
</script>
</body>
          </html>
